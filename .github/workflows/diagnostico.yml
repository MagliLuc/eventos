name: Diagnóstico de fuentes

# Corre `scraper/diagnostico.py` desde el runner y **commitea lo que vio**.
#
# El porqué del commit, en vez de un artifact: desde donde se mantiene el
# scraper no hay salida a internet hacia estos sitios, así que la única forma
# de escribir selectores contra el marcado real es que el HTML llegue al repo.
# Un artifact .zip no se puede leer desde ahí; un archivo commiteado sí.
#
# Nunca falla: lo que produce es evidencia, no un veredicto.
#
# NO corre con cada cambio del scraper. Tarda ~12 minutos porque sondea 21
# sitios con una pausa por dominio, y responde una pregunta que no es la de
# todos los días: "¿por qué este sitio no me deja entrar?". La pregunta
# frecuente —"¿mi cambio suma eventos?"— la contesta `corrida-seco.yml` en un
# cuarto del tiempo. Estaban juntas y la verificación quedaba atrás del
# diagnóstico.

on:
  workflow_dispatch:
  push:
    paths:
      # Sólo lo que cambia el diagnóstico en sí, o el transporte que usa.
      - "scraper/diagnostico.py"
      - "scraper/eventos/http.py"
      - "scraper/sources.json"
      - ".github/workflows/diagnostico.yml"

permissions:
  contents: write

concurrency:
  # Dos diagnósticos a la vez se pisarían el commit de la evidencia. El nuevo
  # gana: siempre trae el estado más reciente.
  group: diagnostico-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Confirmar que el TLS de navegador está disponible
        # Si curl_cffi no cargó, el diagnóstico no puede distinguir un bloqueo
        # por fingerprinting TLS de uno por IP, que es la pregunta principal.
        run: |
          python - <<'PY'
          from curl_cffi import requests
          print("curl_cffi OK:", requests.__name__)
          PY

      - name: Diagnosticar las fuentes
        # Sin `--todos`: las bloqueadas ya tienen veredicto y son las más caras
        # (nueve pedidos de sondeo de caché cada una). Para incluirlas hay que
        # correrlo a mano con --todos; el sondeo semanal de discover.yml es el
        # que detecta si alguna vuelve a responder.
        run: python scraper/diagnostico.py || true

      - name: Commitear la evidencia
        # El diagnóstico tarda ~15 min y en ese rato la rama puede haber
        # avanzado. La primera corrida perdió toda la evidencia justamente por
        # eso: el push salió rechazado con "fetch first". Se reintenta con
        # rebase, que es seguro porque este job solo agrega archivos suyos.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scraper/diagnostico
          if git diff --cached --quiet; then
            echo "Sin cambios en el diagnóstico."
            exit 0
          fi
          git commit -m "chore(diagnostico): evidencia de las fuentes $(date -u +%Y-%m-%d)"
          for intento in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "Evidencia pusheada en el intento $intento."
              exit 0
            fi
            echo "Push rechazado; traigo lo que haya y reintento."
            git pull --rebase origin ${GITHUB_REF_NAME} || exit 1
            sleep $((intento * 3))
          done
          echo "::error::No se pudo pushear la evidencia tras 4 intentos."
          exit 1

name: Publicar en GitHub Pages

# GitHub Pages sirve docs/events.json gratis, con CDN y HTTPS incluidos.
#
# REQUISITO, UNA SOLA VEZ: Settings -> Pages -> Source: "GitHub Actions".
# El GITHUB_TOKEN no puede crear el sitio por mas que tenga `pages: write`:
# crear Pages (POST /repos/{owner}/{repo}/pages) pide permisos de
# administracion del repo, y el token del workflow responde
# "Resource not accessible by integration". La habilitacion inicial es manual.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # GitHub no dispara workflows con eventos generados por el GITHUB_TOKEN.
  # El bot de la agenda commitea docs/events.json con ese token, asi que su
  # push NUNCA disparaba el `push` de arriba: el JSON quedaba en el repo pero
  # el sitio seguia sirviendo el del ultimo deploy hecho por una persona.
  # `workflow_run` si se dispara al terminar el otro workflow.
  workflow_run:
    workflows: ["Actualizar agenda de eventos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Con workflow_run solo publicar si la corrida de la agenda salio bien:
    # no tiene sentido desplegar un JSON que fallo la validacion.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # Explicito: en workflow_run el checkout por defecto puede quedar en
          # un commit anterior al que acaba de pushear el bot.
          ref: main
      # Se deja enablement: true igual. No sirve para la creacion inicial
      # (ver arriba), pero es no-op cuando Pages ya esta activo y vuelve a
      # habilitarlo solo si alguien lo desactiva mas adelante.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

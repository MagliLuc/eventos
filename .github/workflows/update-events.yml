name: Actualizar agenda de eventos

# Costo $0: GitHub Actions es gratuito e ilimitado en repositorios publicos.
# Esta corrida tarda ~1 minuto por dia.
on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 en Buenos Aires (UTC-3)
  workflow_dispatch:       # permite dispararlo a mano desde la pestaña Actions

permissions:
  contents: write          # necesario para commitear el JSON actualizado

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt pytest

      - name: Correr scraper
        run: python scraper/run_scraper.py --days 7

      - name: Validar JSON generado
        run: python -m pytest scraper/tests -q

      - name: Commitear si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json scraper/geocache.json
          if git diff --staged --quiet; then
            echo "Sin cambios en la agenda."
          else
            git commit -m "chore(data): actualizar agenda $(date -u +%Y-%m-%d)"
            git push
          fi
